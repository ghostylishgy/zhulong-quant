  enabled: true
  commission_rate: 0.00025
  commission_min: 5.0
  stamp_tax_rate_sell: 0.0005
  transfer_fee_rate: 0.00001
slippage:
  alpha: 0.1
  beta: 0.05
  description: Price_shadow = Price_logical * (1 +/- (alpha * sigma + beta * Qty/ADV20))
